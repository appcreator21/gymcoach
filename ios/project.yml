name: GymCoach
options:
  bundleIdPrefix: com.gymcoach
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  GymCoach:
    type: application
    platform: iOS
    sources:
      - GymCoach
    info:
      path: GymCoach/Info.plist
      properties:
        CFBundleDisplayName: Surba Fit
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: Surba Fit connects to your Surba Fit server.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.surbafit.app
        TARGETED_DEVICE_FAMILY: "1"
        # Set your Apple developer team here, or pick it in Xcode under Signing.
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
