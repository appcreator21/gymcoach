name: GymCoach
options:
  bundleIdPrefix: com.gymcoach
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  GymCoach:
    type: application
    platform: iOS
    sources:
      - GymCoach
      - Shared
    dependencies:
      - target: SurbaWidgets
    info:
      path: GymCoach/Info.plist
      properties:
        CFBundleDisplayName: Surba Fit
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: Surba Fit connects to your Surba Fit server.
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.surbafit.app
            CFBundleURLSchemes:
              - surbafit
        NSHealthShareUsageDescription: Surba Fit can read your bodyweight from Apple Health.
        NSHealthUpdateUsageDescription: Surba Fit can save your finished workouts and bodyweight to Apple Health.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: GymCoach/GymCoach.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups:
          - group.com.surbafit.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.surbafit.app
        TARGETED_DEVICE_FAMILY: "1"
        # Set your Apple developer team here, or pick it in Xcode under Signing.
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SurbaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - SurbaWidgets
      - Shared
    info:
      path: SurbaWidgets/Info.plist
      properties:
        CFBundleDisplayName: Surba Fit
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: SurbaWidgets/SurbaWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.surbafit.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.surbafit.app.widgets
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        INFOPLIST_KEY_CFBundleDisplayName: Surba Fit
